<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>今日 · desk</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/mine/tokens.css">
<link rel="stylesheet" href="ds/mine/components/bundle.css">
<script src="ds/mine/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:var(--primary-text);text-decoration:none}a:hover{color:var(--foreground)}
.mark{flex:none}
[data-theme="light"] .mark{filter:invert(1)}
</style>
</helmet>
<div class="{{themeClass}}" data-theme="{{theme}}" style="min-height: 1240px; display: flex; background: var(--background); background-image: {{sky}}; color: var(--foreground); font-family: var(--font-sans); font-size: 13px; line-height: 1.5">

<aside aria-label="メニュー" style="flex: none; width: 244px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px; padding: 12px 8px; border-right: 1px solid var(--border)">
<div style="display: flex; align-items: center; gap: 10px; padding: 2px 8px 20px"><img class="mark" src="assets/mine-icon.png" alt="" width="28" height="28" style="border-radius: 7px"><span style="font-size: 15px; font-weight: 600; letter-spacing: .02em">Mine</span></div>
<sc-for list="{{nav}}" as="item" hint-placeholder-count="4">
<a href="{{item.href}}" style="display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px; border-radius: 6px; color: {{item.color}}; background: {{item.bg}}; box-shadow: {{item.shadow}}"><x-import component-from-global-scope="Mine.Icon" name="{{item.icon}}"></x-import>{{item.label}}</a>
</sc-for>
<div style="flex: 1"></div>
<a href="#" style="display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px; border-radius: 6px; color: var(--foreground)"><x-import component-from-global-scope="Mine.Icon" name="settings"></x-import>設定</a>
</aside>

<div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
<header style="height: 48px; flex: none; display: flex; align-items: center; padding: 0 24px; border-bottom: 1px solid var(--border)">
<h1 style="margin: 0; font-size: 15px; font-weight: 600; letter-spacing: var(--tracking-heading)">今日</h1>
</header>

<main style="padding: 24px 30px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">

<x-import component-from-global-scope="Mine.Card" style="flex: 999 1 420px; min-width: 0; align-self: stretch">
<x-import component-from-global-scope="Mine.CardHeader">
<x-import component-from-global-scope="Mine.CardTitle"><span style="display: inline-flex; align-items: center; gap: 8px"><x-import component-from-global-scope="Mine.Icon" name="calendar-time"></x-import>今日の予定</span></x-import>
<x-import component-from-global-scope="Mine.CardAction"><a href="#" style="display: inline-flex; align-items: center; gap: 2px; font-size: 12px">カレンダー<x-import component-from-global-scope="Mine.Icon" name="chevron-right" size="{{i14}}"></x-import></a></x-import>
</x-import>
<x-import component-from-global-scope="Mine.CardContent">
<div style="display: flex; flex-direction: column; gap: 14px">
<sc-for list="{{events}}" as="ev" hint-placeholder-count="3">
<div style="display: grid; grid-template-columns: 8px 92px minmax(0, 1fr); gap: 12px; align-items: baseline">
<span style="width: 7px; height: 7px; border-radius: 50%; background: var(--primary-text); box-shadow: 0 0 6px var(--primary-text)"></span>
<span style="font-family: var(--font-mono); font-size: 12px; color: var(--muted-foreground)">{{ev.time}}</span>
<span style="display: flex; flex-direction: column"><span style="font-size: 14px">{{ev.title}}</span><span style="font-size: 11px; color: var(--muted-foreground)">{{ev.place}}</span></span>
</div>
</sc-for>
</div>
</x-import>
</x-import>

<div style="flex: 1 1 300px; max-width: 314px; display: flex; flex-direction: column; gap: 16px">
<x-import component-from-global-scope="Mine.Card" style="box-shadow: var(--glow)">
<x-import component-from-global-scope="Mine.CardHeader">
<x-import component-from-global-scope="Mine.CardTitle"><span style="display: inline-flex; align-items: center; gap: 8px"><x-import component-from-global-scope="Mine.Icon" name="player-play"></x-import>計測</span></x-import>
<x-import component-from-global-scope="Mine.CardAction"><a href="time.desk.dc.html" style="display: inline-flex; align-items: center; gap: 2px; font-size: 12px">記録<x-import component-from-global-scope="Mine.Icon" name="chevron-right" size="{{i14}}"></x-import></a></x-import>
</x-import>
<x-import component-from-global-scope="Mine.CardContent">
<div style="display: flex; align-items: center; gap: 12px">
<span aria-hidden="true" style="flex: none; position: relative; width: 44px; height: 44px; color: var(--primary-text); filter: drop-shadow(0 0 6px rgba(205,220,245,.35))"><svg width="44" height="44" viewBox="0 0 44 44" style="position: absolute; inset: 0"><circle cx="22.0" cy="22.0" r="18.0" fill="none" stroke="var(--border)" stroke-width="2"/><circle cx="22.0" cy="22.0" r="18.0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="94.2 113.1" transform="rotate(-90 22.0 22.0)"/></svg><svg width="14" height="14" viewBox="0 0 24 24" style="position: absolute; left: 15.0px; top: 15.0px"><path d="M12 1.5C12.9 8.3 15.7 11.1 22.5 12C15.7 12.9 12.9 15.7 12 22.5C11.1 15.7 8.3 12.9 1.5 12C8.3 11.1 11.1 8.3 12 1.5Z" fill="currentColor"/></svg></span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<span style="font-weight: 500">ゼミ発表のスライド</span>
<span style="display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted-foreground)"><span style="width: 7px; height: 7px; border-radius: 50%; background: var(--chart-1)"></span>大学 / 研究</span>
</div>
<span style="display: flex; flex-direction: column; align-items: flex-end"><span style="font-family: var(--font-mono); font-size: 16px; text-shadow: var(--glow-text)">1:15:00</span><span style="font-size: 11px; color: var(--muted-foreground)">見積もり 90分</span></span>
<x-import component-from-global-scope="Mine.Button" variant="destructive" size="icon" aria-label="止める"><x-import component-from-global-scope="Mine.Icon" name="player-stop" filled="{{yes}}"></x-import></x-import>
</div>
</x-import>
</x-import>

<x-import component-from-global-scope="Mine.Card">
<x-import component-from-global-scope="Mine.CardHeader">
<x-import component-from-global-scope="Mine.CardTitle"><span style="display: inline-flex; align-items: center; gap: 8px"><x-import component-from-global-scope="Mine.Icon" name="checklist"></x-import>今日やるタスク</span></x-import>
<x-import component-from-global-scope="Mine.CardAction"><a href="tasks.desk.dc.html" style="display: inline-flex; align-items: center; gap: 2px; font-size: 12px">タスク<x-import component-from-global-scope="Mine.Icon" name="chevron-right" size="{{i14}}"></x-import></a></x-import>
</x-import>
<x-import component-from-global-scope="Mine.CardContent">
<div style="display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{groups}}" as="group" hint-placeholder-count="2">
<div style="display: flex; align-items: baseline; gap: 6px; padding: 8px 0 6px; border-bottom: 1px solid var(--border-subtle)"><span style="font-weight: 600">{{group.label}}</span><span style="font-size: 11px; color: var(--muted-foreground)">{{group.count}}</span></div>
<sc-for list="{{group.tasks}}" as="task" hint-placeholder-count="2">
<div style="display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border-subtle)">
<span style="flex: none; width: 15px; height: 15px; margin-top: 2px; border-radius: 50%; border: 1.5px solid {{task.ring}}"></span>
<div style="min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span>{{task.title}}</span>
<span style="display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 11px; color: var(--muted-foreground)">
<sc-for list="{{task.meta}}" as="m" hint-placeholder-count="2"><span style="display: inline-flex; align-items: center; gap: 3px; color: {{m.color}}"><sc-if value="{{m.icon}}" hint-placeholder-val="{{yes}}"><x-import component-from-global-scope="Mine.Icon" name="{{m.icon}}" size="{{i12}}" color="{{m.iconColor}}"></x-import></sc-if>{{m.text}}</span></sc-for>
</span>
</div>
</div>
</sc-for>
</sc-for>
</div>
</x-import>
</x-import>
</div>
</div>

<x-import component-from-global-scope="Mine.Card">
<x-import component-from-global-scope="Mine.CardHeader">
<x-import component-from-global-scope="Mine.CardTitle"><span style="display: inline-flex; align-items: center; gap: 8px"><x-import component-from-global-scope="Mine.Icon" name="messages"></x-import>Claude のスレッド</span></x-import>
</x-import>
<x-import component-from-global-scope="Mine.CardContent">
<div style="display: flex; flex-direction: column">
<sc-for list="{{threads}}" as="th" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border-subtle)">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="display: flex; align-items: center; gap: 8px"><x-import component-from-global-scope="Mine.Badge" variant="{{th.badge}}">{{th.status}}</x-import><span style="font-size: 14px">{{th.title}}</span></span>
<span style="font-size: 12px; color: var(--muted-foreground)">{{th.next}}</span>
<span style="font-size: 11px; color: var(--muted-foreground)">{{th.meta}}</span>
</div>
<x-import component-from-global-scope="Mine.IconButton" icon="check" label="完了にする"></x-import>
</div>
</sc-for>
</div>
</x-import>
</x-import>

<x-import component-from-global-scope="Mine.Card">
<x-import component-from-global-scope="Mine.CardHeader">
<x-import component-from-global-scope="Mine.CardTitle"><span style="display: inline-flex; align-items: center; gap: 8px"><x-import component-from-global-scope="Mine.Icon" name="chart-bar"></x-import>今週の時間配分</span></x-import>
</x-import>
<x-import component-from-global-scope="Mine.CardContent">
<div style="display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-end">
<div style="display: flex; flex-direction: column; gap: 4px; min-width: 200px">
<span style="font-size: 26px; font-weight: 600; letter-spacing: var(--tracking-heading)">12時間25分</span>
<span style="font-family: var(--font-mono); font-size: 12px; color: var(--muted-foreground)">¥11,250</span>
</div>
<div style="flex: 1 1 360px; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{projects}}" as="p" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; justify-content: space-between"><span>{{p.name}}</span><span style="font-family: var(--font-mono); font-size: 12px">{{p.time}}</span></div>
<div style="height: 6px; border-radius: 999px; background: var(--muted)"><div style="height: 6px; border-radius: 999px; width: {{p.width}}; background: {{p.color}}; box-shadow: 0 0 10px -2px {{p.color}}"></div></div>
</div>
</sc-for>
</div>
</div>
</x-import>
</x-import>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1280,"height":1240}}'>
class Component extends DCLogic {
renderVals() {
const theme = this.props.theme ?? 'dark';
const nav = (label, icon, href, active) => ({ label: label, icon: icon, href: href, color: active ? 'var(--primary-text)' : 'var(--muted-foreground)', bg: active ? 'var(--primary-soft)' : 'transparent', shadow: active ? 'var(--glow)' : 'none' });
const muted = 'var(--muted-foreground)';
return {
theme: theme,
themeClass: theme === 'dark' ? 'dark' : 'light',
sky: theme === 'dark' ? 'radial-gradient(900px 420px at 18% -8%, rgba(200,215,240,0.07), transparent 65%)' : 'none',
yes: true, i12: 12, i14: 14,
nav: [
nav('今日', 'home', 'today.desk.dc.html', true),
nav('タスク', 'checklist', 'tasks.desk.dc.html', false),
nav('記録', 'clock-hour-4', 'time.desk.dc.html', false),
nav('カレンダー', 'calendar', '#', false)
],
events: [
{ time: '10:00–11:00', title: '研究室ミーティング', place: '工学部 3 号館' },
{ time: '16:30–18:00', title: 'ゼミ発表', place: '講義室 B' },
{ time: '19:00–19:30', title: '夕食の買い出し', place: '' }
],
groups: [
{ label: '期限切れ', count: 1, tasks: [
{ title: '燃えるゴミを出す', ring: muted, meta: [
{ icon: 'calendar-event', text: '昨日', color: 'var(--destructive-text)', iconColor: 'currentColor' },
{ icon: 'repeat', text: '毎週 月・木', color: muted, iconColor: 'currentColor' },
{ icon: '', text: '@家', color: muted, iconColor: 'currentColor' },
{ icon: 'point-filled', text: '生活', color: muted, iconColor: 'var(--chart-3)' }
] }
] },
{ label: '今日', count: 3, tasks: [
{ title: 'ゼミ発表のスライドを仕上げる', ring: 'var(--destructive-text)', meta: [
{ icon: 'flag', text: '今日まで', color: 'var(--success-text)', iconColor: 'currentColor' },
{ icon: 'hourglass', text: '90分', color: muted, iconColor: 'currentColor' },
{ icon: '', text: '@PC', color: muted, iconColor: 'currentColor' },
{ icon: 'point-filled', text: '大学 / 研究', color: muted, iconColor: 'var(--chart-1)' }
] },
{ title: 'Mine のデザインをキャンバスに起こす', ring: 'var(--warning-text)', meta: [
{ icon: 'sparkles', text: 'next', color: 'var(--primary-text)', iconColor: 'currentColor' },
{ icon: '', text: '@PC', color: muted, iconColor: 'currentColor' },
{ icon: 'point-filled', text: '個人開発', color: muted, iconColor: 'var(--chart-4)' }
] },
{ title: '週次レポートを送る', ring: 'var(--primary-text)', meta: [
{ icon: 'calendar-event', text: '今日', color: 'var(--success-text)', iconColor: 'currentColor' },
{ icon: 'repeat', text: '毎週 火', color: muted, iconColor: 'currentColor' },
{ icon: 'point-filled', text: '仕事', color: muted, iconColor: 'var(--chart-2)' }
] }
] }
],
threads: [
{ status: 'あなた待ち', badge: 'info', title: 'Claude Design 駆動のデザイン運用を作る', next: 'キャンバスの今の画面を見て、直したいところを書く', meta: '個人開発・13:40' },
{ status: '作業中', badge: 'neutral', title: '実験データをまとめる', next: '実験データの集計を進めている。', meta: '大学 / 研究・12:10' }
],
projects: [
{ name: '大学 / 研究', time: '6時間15分', width: '100%', color: 'var(--chart-1)' },
{ name: '仕事', time: '4時間30分', width: '72%', color: 'var(--chart-2)' },
{ name: '個人開発', time: '1時間40分', width: '27%', color: 'var(--chart-4)' }
]
};
}
}
</script>
</body>
</html>
