<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>起動 · mobile</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/mine/tokens.css">
<link rel="stylesheet" href="ds/mine/components/bundle.css">
<script src="ds/mine/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:var(--primary-text);text-decoration:none}a:hover{color:var(--foreground)}
.mark{flex:none}
[data-theme="light"] .mark{filter:invert(1)}
.hours{background-image:linear-gradient(to bottom, var(--border-subtle) 1px, transparent 1px)}
</style>
</helmet>
<div class="{{themeClass}}" data-theme="{{theme}}" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; display: grid; place-items: center; overflow: hidden; background: var(--background); color: var(--foreground); font-family: var(--font-sans)">
<div style="position: absolute; top: 50%; left: 50%; width: 422px; height: 422px; margin: -211px 0 0 -211px; border-radius: 50%; background: radial-gradient(closest-side, {{core}}, transparent)"></div>
<div style="position: absolute; top: 50%; left: 50%; width: 1114px; height: 1114px; margin: -557px 0 0 -557px; border-radius: 50%; background: radial-gradient(closest-side, var(--chart-1), transparent); opacity: {{light}}; transform: translate(0px, -243px)"></div>
<div style="position: absolute; top: 50%; left: 50%; width: 1114px; height: 1114px; margin: -557px 0 0 -557px; border-radius: 50%; background: radial-gradient(closest-side, var(--chart-2), transparent); opacity: {{light}}; transform: translate(230px, -81px)"></div>
<div style="position: absolute; top: 50%; left: 50%; width: 1114px; height: 1114px; margin: -557px 0 0 -557px; border-radius: 50%; background: radial-gradient(closest-side, var(--chart-3), transparent); opacity: {{light}}; transform: translate(149px, 203px)"></div>
<div style="position: absolute; top: 50%; left: 50%; width: 1114px; height: 1114px; margin: -557px 0 0 -557px; border-radius: 50%; background: radial-gradient(closest-side, var(--chart-4), transparent); opacity: {{light}}; transform: translate(-149px, 203px)"></div>
<div style="position: absolute; top: 50%; left: 50%; width: 1114px; height: 1114px; margin: -557px 0 0 -557px; border-radius: 50%; background: radial-gradient(closest-side, var(--chart-5), transparent); opacity: {{light}}; transform: translate(-230px, -81px)"></div>
<div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 18px">
<div style="position: relative; width: 112px; height: 112px; overflow: hidden; border-radius: 22%; isolation: isolate">
<img class="mark" src="assets/mine-icon.png" alt="" width="112" height="112" style="display: block; width: 100%; height: 100%">
<span style="position: absolute; inset: -40%; background: linear-gradient(115deg, transparent 38%, #8fb4ff 44%, #6fd1b0 48%, #efb36d 52%, #f2828c 56%, #b49cff 60%, transparent 66%); mix-blend-mode: overlay"></span>
</div>
<div style="font-size: 22px; font-weight: 600; letter-spacing: .16em; margin-right: -.16em">Mine</div>
<div style="width: 128px; height: 2px; margin-top: -6px; border-radius: 1px; background: var(--prism); opacity: .85"></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const theme = this.props.theme ?? 'dark';
return {
theme: theme,
themeClass: theme === 'dark' ? 'dark' : 'light',
light: theme === 'dark' ? 0.3 : 0.24,
core: theme === 'dark' ? 'rgba(238,241,245,0.16)' : 'rgba(255,255,255,0.9)',
sky: theme === 'dark' ? 'radial-gradient(900px 420px at 18% -8%, rgba(200,215,240,0.07), transparent 65%)' : 'none',
yes: true, i12: 12, i14: 14, i16: 16, i24: 24
};
}
}
</script>
</body>
</html>
