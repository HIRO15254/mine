<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>カレンダー · mobile</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/mine/tokens.css">
<link rel="stylesheet" href="ds/mine/components/bundle.css">
<script src="ds/mine/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:var(--primary-text);text-decoration:none}a:hover{color:var(--foreground)}
.mark{flex:none}
[data-theme="light"] .mark{filter:invert(1)}
.hours{background-image:linear-gradient(to bottom, var(--border-subtle) 1px, transparent 1px)}
</style>
</helmet>
<div class="{{themeClass}}" data-theme="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: var(--background); background-image: {{sky}}; color: var(--foreground); font-family: var(--font-sans); font-size: var(--m-text-secondary); line-height: 1.4">

<header style="position: relative; flex: none; height: 44px; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 14px; border-bottom: 1px solid var(--border)"><div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; opacity: .8; background: linear-gradient(90deg, var(--chart-1), var(--chart-2), var(--chart-3), var(--chart-4), var(--chart-5))"></div>
<img class="mark" src="assets/mine-icon.png" alt="" width="24" height="24" style="border-radius: 6px; margin-right: 10px">
<h1 style="flex: 1; margin: 0; font-size: var(--m-text-title); font-weight: 600; letter-spacing: var(--tracking-heading)">11月9日〜15日</h1>
<x-import component-from-global-scope="Mine.Button" variant="outline" size="sm">今週</x-import><x-import component-from-global-scope="Mine.IconButton" icon="chevron-left" label="前の週" size="xl"></x-import><x-import component-from-global-scope="Mine.IconButton" icon="chevron-right" label="次の週" size="xl"></x-import>
</header>

<div style="flex: none; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; padding: 12px 14px 8px"><span style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: var(--radius-lg); font-size: 12px; border: 1px solid transparent; color: var(--muted-foreground)">月<span style="font-size: var(--m-text-body); font-weight: 600; color: var(--foreground)">9</span></span><span style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: var(--radius-lg); font-size: 12px; border: 1px solid var(--ring); background: var(--primary-soft); color: var(--primary-text); box-shadow: var(--glow)">火<span style="font-size: var(--m-text-body); font-weight: 600; color: var(--primary-text)">10</span></span><span style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: var(--radius-lg); font-size: 12px; border: 1px solid transparent; color: var(--muted-foreground)">水<span style="font-size: var(--m-text-body); font-weight: 600; color: var(--foreground)">11</span></span><span style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: var(--radius-lg); font-size: 12px; border: 1px solid transparent; color: var(--muted-foreground)">木<span style="font-size: var(--m-text-body); font-weight: 600; color: var(--foreground)">12</span></span><span style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: var(--radius-lg); font-size: 12px; border: 1px solid transparent; color: var(--muted-foreground)">金<span style="font-size: var(--m-text-body); font-weight: 600; color: var(--foreground)">13</span></span><span style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: var(--radius-lg); font-size: 12px; border: 1px solid transparent; color: var(--muted-foreground)">土<span style="font-size: var(--m-text-body); font-weight: 600; color: var(--foreground)">14</span></span><span style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: var(--radius-lg); font-size: 12px; border: 1px solid transparent; color: var(--muted-foreground)">日<span style="font-size: var(--m-text-body); font-weight: 600; color: var(--foreground)">15</span></span></div>

<section aria-label="時間が決まっていないタスク" style="flex: none; height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 14px; border-bottom: 1px solid var(--border)">
<div style="flex: none; display: flex"><span style="height: 28px; display: inline-flex; align-items: center; padding: 0 10px; font-size: 12px; font-weight: 500; border: 1px solid var(--ring); border-radius: var(--radius-lg) 0 0 var(--radius-lg); background: var(--primary-soft); color: var(--primary-text)">今日</span><span style="height: 28px; display: inline-flex; align-items: center; padding: 0 10px; margin-left: -1px; font-size: 12px; font-weight: 500; border: 1px solid var(--input); border-radius: 0 var(--radius-lg) var(--radius-lg) 0; background: var(--card); color: var(--muted-foreground)">すべて</span></div>
<div style="flex: 1; min-width: 0; display: flex; gap: 4px; overflow: hidden"><div style="flex: none; width: 160px"><div style="display: flex; align-items: center; gap: 4px; min-width: 0; padding: 4px 6px; border-radius: var(--radius-md); border: 1px dashed color-mix(in srgb, var(--chart-1) 70%, transparent); background: var(--card); font-size: 12px; cursor: grab;"><x-import component-from-global-scope="Mine.Icon" name="checklist" size="{{i12}}" color="var(--chart-1)"></x-import><span style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500">ゼミ発表のスライドを仕上げる</span></div></div><div style="flex: none; width: 160px"><div style="display: flex; align-items: center; gap: 4px; min-width: 0; padding: 4px 6px; border-radius: var(--radius-md); border: 1px dashed color-mix(in srgb, var(--chart-4) 70%, transparent); background: var(--card); font-size: 12px; cursor: grab;"><x-import component-from-global-scope="Mine.Icon" name="checklist" size="{{i12}}" color="var(--chart-4)"></x-import><span style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500">Mine のデザインをキャンバスに起こす</span></div></div></div>
</section>

<div style="flex: none; display: grid; grid-template-columns: 2.75rem minmax(0, 1fr); padding: 0 14px; border-bottom: 1px solid var(--border)">
<span style="align-self: start; padding: 6px 6px 0 0; text-align: right; font-size: 11px; color: var(--muted-foreground)">終日</span>
<div style="display: flex; flex-direction: column; gap: 2px; min-width: 0; min-height: 32px; padding: 2px; box-sizing: border-box; border-left: 1px solid var(--border-subtle)"></div>
</div>

<div style="flex: 1; min-height: 0; overflow: hidden; padding: 0 14px">
<div style="position: relative; display: grid; grid-template-columns: 2.75rem minmax(0, 1fr)">
<div style="position: relative; height: 672px"><span style="position: absolute; right: 6px; top: 48px; font-family: var(--font-mono); font-size: 11px; color: var(--muted-foreground)">12:00</span><span style="position: absolute; right: 6px; top: 104px; font-family: var(--font-mono); font-size: 11px; color: var(--muted-foreground)">13:00</span><span style="position: absolute; right: 6px; top: 160px; font-family: var(--font-mono); font-size: 11px; color: var(--muted-foreground)">14:00</span><span style="position: absolute; right: 6px; top: 216px; font-family: var(--font-mono); font-size: 11px; color: var(--muted-foreground)">15:00</span><span style="position: absolute; right: 6px; top: 272px; font-family: var(--font-mono); font-size: 11px; color: var(--muted-foreground)">16:00</span><span style="position: absolute; right: 6px; top: 328px; font-family: var(--font-mono); font-size: 11px; color: var(--muted-foreground)">17:00</span><span style="position: absolute; right: 6px; top: 384px; font-family: var(--font-mono); font-size: 11px; color: var(--muted-foreground)">18:00</span><span style="position: absolute; right: 6px; top: 440px; font-family: var(--font-mono); font-size: 11px; color: var(--muted-foreground)">19:00</span><span style="position: absolute; right: 6px; top: 496px; font-family: var(--font-mono); font-size: 11px; color: var(--muted-foreground)">20:00</span><span style="position: absolute; right: 6px; top: 552px; font-family: var(--font-mono); font-size: 11px; color: var(--muted-foreground)">21:00</span><span style="position: absolute; right: 6px; top: 608px; font-family: var(--font-mono); font-size: 11px; color: var(--muted-foreground)">22:00</span><span style="position: absolute; right: 4px; top: 179px; z-index: 1; padding: 0 2px; background: var(--background); font-family: var(--font-mono); font-size: 11px; font-weight: 600; color: var(--primary-text); text-shadow: var(--glow-text)">14:20</span></div>
<div class="hours" style="position: relative; height: 672px; border-left: 1px solid var(--border-subtle); background-size: 100% 56px; background-position: 0 0px"><div style="position: absolute; left: 2px; right: 2px; top: 309px; height: 82px; box-sizing: border-box; display: flex; flex-direction: column; padding: 2px 6px; overflow: hidden; border-radius: var(--radius-md); border-left: 3px solid #4593f8; background: color-mix(in srgb, #4593f8 18%, var(--card)); font-size: 12px; line-height: 1.35"><span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500">ゼミ発表</span><span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; color: var(--muted-foreground)">16:30–18:00 講義室 B</span></div><div style="position: absolute; left: 2px; right: 2px; top: 449px; height: 26px; box-sizing: border-box; display: flex; flex-direction: row; align-items: center; gap: 6px; padding: 0 6px; overflow: hidden; border-radius: var(--radius-md); border-left: 3px solid #4593f8; background: color-mix(in srgb, #4593f8 18%, var(--card)); font-size: 12px; line-height: 1.35"><span style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500">夕食の買い出し</span><span style="flex: none; font-size: 11px; color: var(--muted-foreground)">19:00–19:30</span></div><div style="position: absolute; left: 2px; right: 2px; top: 225px; height: 26px; box-sizing: border-box; display: flex; align-items: center; gap: 6px; padding: 0 6px; overflow: hidden; border-radius: var(--radius-md); border: 1px dashed color-mix(in srgb, var(--chart-2) 70%, transparent); background: var(--card); font-size: 12px; cursor: grab"><x-import component-from-global-scope="Mine.Icon" name="checklist" size="{{i12}}" color="var(--chart-2)"></x-import><span style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500">週次レポートを送る</span><span style="flex: none; font-size: 11px; color: var(--muted-foreground)">15:00–15:30</span></div><div style="position: absolute; left: 0; right: 0; top: 187px; z-index: 3"><div style="height: 2px; background: linear-gradient(90deg, var(--chart-1), var(--chart-2), var(--chart-3), var(--chart-4), var(--chart-5)); box-shadow: var(--glow)"></div><span style="position: absolute; left: -4px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--primary-text); box-shadow: 0 0 8px var(--primary-text)"></span></div></div>
</div>
</div>

<nav aria-label="メニュー" style="flex: none; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 4px 0 10px; background: var(--background); border-top: 1px solid var(--border)">
<a href="today.mobile.dc.html" style="height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: var(--m-text-tab); font-weight: 500; color: var(--muted-foreground); filter: none"><x-import component-from-global-scope="Mine.Icon" name="home" size="{{i24}}"></x-import>今日</a><a href="tasks.mobile.dc.html" style="height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: var(--m-text-tab); font-weight: 500; color: var(--muted-foreground); filter: none"><x-import component-from-global-scope="Mine.Icon" name="checklist" size="{{i24}}"></x-import>タスク</a><a href="time.mobile.dc.html" style="height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: var(--m-text-tab); font-weight: 500; color: var(--muted-foreground); filter: none"><x-import component-from-global-scope="Mine.Icon" name="clock-hour-4" size="{{i24}}"></x-import>記録</a><a href="calendar.mobile.dc.html" style="height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: var(--m-text-tab); font-weight: 500; color: var(--primary-text); filter: drop-shadow(0 0 6px rgba(205,220,245,.45))"><x-import component-from-global-scope="Mine.Icon" name="calendar" size="{{i24}}"></x-import>カレンダー</a><a href="#" style="height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: var(--m-text-tab); font-weight: 500; color: var(--muted-foreground); filter: none"><x-import component-from-global-scope="Mine.Icon" name="settings" size="{{i24}}"></x-import>設定</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const theme = this.props.theme ?? 'dark';
return {
theme: theme,
themeClass: theme === 'dark' ? 'dark' : 'light',
sky: theme === 'dark' ? 'radial-gradient(900px 420px at 18% -8%, rgba(200,215,240,0.07), transparent 65%)' : 'none',
yes: true, i12: 12, i14: 14, i16: 16, i24: 24
};
}
}
</script>
</body>
</html>
