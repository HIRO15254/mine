name: Production Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

# The Cloudflare token is given only to the steps that deploy, so installing
# dependencies and running tests never see it.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  ci:
    # A manual run from another branch must not reach production.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # Types, lint, tests and both builds: nothing is deployed unless all pass.
      - run: bun run verify
        env:
          VITE_SERVER_URL: ${{ vars.PRODUCTION_API_URL }}

  db-migrate:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Require a configured production D1 database
        run: |
          id=$(jq -r '.d1_databases[0].database_id' apps/server/wrangler.jsonc)
          test "$id" != "00000000-0000-0000-0000-000000000000" || {
            echo "::error::Create the production D1 database and set its UUID in apps/server/wrangler.jsonc"
            exit 1
          }
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if find packages/db/src/migrations -maxdepth 1 -name '*.sql' -print -quit | grep -q .; then
            bun run db:migrate:remote
          else
            echo "No application migrations to apply"
          fi

  deploy-api:
    needs: db-migrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Deploy Worker
        working-directory: apps/server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
          PRODUCTION_WEB_URL: ${{ vars.PRODUCTION_WEB_URL }}
        run: bunx wrangler deploy --var "CORS_ORIGIN:${PRODUCTION_WEB_URL}" --var "BETTER_AUTH_URL:${PRODUCTION_API_URL}"

  deploy-web:
    needs: deploy-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Build web
        env:
          VITE_SERVER_URL: ${{ vars.PRODUCTION_API_URL }}
        run: bun run --filter @mine/web build
      - name: Deploy Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          app_slug=$(jq -r '.name' package.json)
          bunx wrangler pages deploy apps/web/dist --project-name "$app_slug" --branch master
