<!doctype html>
<html lang="ja">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Mine</title>
		<!--
			The launch: the Mine mark lights up and a prism passes through it while
			the app loads. It is inline because it shows before the app's CSS;
			the colors copy the tokens in src/index.css (docs/design/exceptions.md).
			src/lib/splash.ts takes it away once the first screen is ready.
		-->
		<style>
		#splash {
			--sp-bg: #f6f7f9;
			--sp-fg: #14161a;
			--sp-prism: linear-gradient(
				90deg,
				#2f6fe0,
				#0c8a63,
				#b06a00,
				#c8434f,
				#7a52d6
			);
			--sp-aura: conic-gradient(
				from 0deg,
				#2f6fe0,
				#0c8a63,
				#b06a00,
				#c8434f,
				#7a52d6,
				#2f6fe0
			);
			--sp-mark-filter: invert(1);
			--sp-blend: soft-light;
			position: fixed;
			inset: 0;
			z-index: 2147483647;
			display: grid;
			place-items: center;
			font-family:
				"Noto Sans JP", system-ui, -apple-system, "Segoe UI", sans-serif;
			color: var(--sp-fg);
			background: var(--sp-bg);
			transition:
				opacity 0.45s ease,
				visibility 0s linear 0.45s;
		}
		#splash.sp-dark {
			--sp-bg: #060709;
			--sp-fg: #eef1f5;
			--sp-prism: linear-gradient(
				90deg,
				#8fb4ff,
				#6fd1b0,
				#efb36d,
				#f2828c,
				#b49cff
			);
			--sp-aura: conic-gradient(
				from 0deg,
				#8fb4ff,
				#6fd1b0,
				#efb36d,
				#f2828c,
				#b49cff,
				#8fb4ff
			);
			--sp-mark-filter: none;
			--sp-blend: overlay;
		}
		.sp-stage {
			position: relative;
			display: flex;
			flex-direction: column;
			gap: 18px;
			align-items: center;
		}
		.sp-aura {
			position: absolute;
			top: -34px;
			width: 180px;
			height: 180px;
			background: var(--sp-aura);
			border-radius: 50%;
			opacity: 0;
			filter: blur(46px);
			animation:
				sp-aura-in 1.1s ease-out 0.15s forwards,
				sp-turn 6s linear infinite;
		}
		.sp-mark {
			position: relative;
			width: 112px;
			height: 112px;
			overflow: hidden;
			border-radius: 22%;
			isolation: isolate;
			opacity: 0;
			animation: sp-mark-in 0.75s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
		}
		.sp-mark img {
			display: block;
			width: 100%;
			height: 100%;
			filter: var(--sp-mark-filter);
		}
		.sp-sweep {
			position: absolute;
			inset: -40%;
			background: linear-gradient(
				115deg,
				transparent 38%,
				#8fb4ff 44%,
				#6fd1b0 48%,
				#efb36d 52%,
				#f2828c 56%,
				#b49cff 60%,
				transparent 66%
			);
			mix-blend-mode: var(--sp-blend);
			transform: translateX(-70%);
			animation: sp-sweep 1.1s cubic-bezier(0.45, 0, 0.2, 1) 0.3s forwards;
		}
		.sp-word {
			margin-right: -0.32em;
			font-size: 22px;
			font-weight: 600;
			letter-spacing: 0.32em;
			opacity: 0;
			transform: translateY(6px);
			animation: sp-word-in 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) 0.45s forwards;
		}
		.sp-line {
			width: 128px;
			height: 2px;
			margin-top: -6px;
			background: var(--sp-prism);
			border-radius: 1px;
			opacity: 0.85;
			transform: scaleX(0);
			animation: sp-line-in 0.7s cubic-bezier(0.65, 0, 0.35, 1) 0.65s forwards;
		}
		#splash.sp-out {
			visibility: hidden;
			opacity: 0;
		}
		#splash.sp-out .sp-mark {
			animation: sp-mark-out 0.45s ease-in forwards;
		}
		#splash.sp-out .sp-aura {
			animation: sp-aura-out 0.45s ease-in forwards;
		}
		@keyframes sp-mark-in {
			from {
				opacity: 0;
				transform: scale(0.84);
				filter: blur(12px);
			}
			to {
				opacity: 1;
				transform: none;
				filter: none;
			}
		}
		@keyframes sp-mark-out {
			from {
				opacity: 1;
			}
			to {
				opacity: 1;
				transform: scale(1.14);
				filter: blur(6px);
			}
		}
		@keyframes sp-aura-out {
			from {
				opacity: 0.32;
			}
			to {
				opacity: 0;
				transform: scale(1.4);
			}
		}
		@keyframes sp-aura-in {
			to {
				opacity: 0.32;
			}
		}
		@keyframes sp-turn {
			to {
				rotate: 360deg;
			}
		}
		@keyframes sp-sweep {
			to {
				transform: translateX(70%);
			}
		}
		@keyframes sp-word-in {
			to {
				opacity: 1;
				transform: none;
				letter-spacing: 0.14em;
				margin-right: -0.14em;
			}
		}
		@keyframes sp-line-in {
			to {
				transform: scaleX(1);
			}
		}
		@media (prefers-reduced-motion: reduce) {
			#splash *,
			#splash.sp-out * {
				opacity: 1;
				filter: none;
				transform: none;
				transition: none !important;
				animation: none !important;
			}
			.sp-aura,
			.sp-sweep {
				display: none;
			}
			#splash.sp-out .sp-mark img {
				filter: var(--sp-mark-filter);
			}
		}
		</style>
	</head>
	<body>
		<div aria-hidden="true" id="splash">
			<div class="sp-stage">
				<div class="sp-aura"></div>
				<div class="sp-mark">
					<img alt="" height="112" src="/logo.png" width="112">
					<span class="sp-sweep"></span>
				</div>
				<div class="sp-word">Mine</div>
				<div class="sp-line"></div>
			</div>
		</div>
		<script>
		"use strict";
		// Match the theme next-themes will pick ("theme" in localStorage).
		(() => {
			let theme = "system";
			try {
				theme = localStorage.getItem("theme") || "system";
			} catch {
				// Storage blocked: follow the system.
			}
			const dark =
				theme === "dark" ||
				(theme !== "light" &&
					matchMedia("(prefers-color-scheme: dark)").matches);
			document.getElementById("splash").classList.toggle("sp-dark", dark);
			window.__splashStart = performance.now();
			// Never cover the page for good, even if the app fails to load.
			setTimeout(() => {
				document.getElementById("splash")?.classList.add("sp-out");
			}, 10_000);
		})();
		</script>
		<div id="app"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
