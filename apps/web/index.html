<!doctype html>
<html lang="ja">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Mine</title>
		<!--
			The launch: the Mine mark settles in and soft prism light spreads out
			from it until it fills the screen while the app loads. When the app is
			ready the light keeps spreading and the screen fades onto the first
			screen. Everything moves only by transform and opacity, so it stays
			smooth while the app's script starts. It is inline because it shows
			before the app's CSS; the colors copy the tokens in src/index.css
			(docs/design/exceptions.md). src/lib/splash.ts takes it away once the
			first screen is ready.
		-->
		<style>
		#splash {
			--sp-bg: #f6f7f9;
			--sp-fg: #14161a;
			--sp-c1: #2f6fe0;
			--sp-c2: #0c8a63;
			--sp-c3: #b06a00;
			--sp-c4: #c8434f;
			--sp-c5: #7a52d6;
			--sp-core: rgba(255, 255, 255, 0.9);
			--sp-ripple: rgba(20, 22, 26, 0.07);
			--sp-light: 0.24;
			--sp-mark-filter: invert(1);
			--sp-blend: soft-light;
			position: fixed;
			inset: 0;
			z-index: 2147483647;
			display: grid;
			place-items: center;
			overflow: hidden;
			font-family:
				"Noto Sans JP", system-ui, -apple-system, "Segoe UI", sans-serif;
			color: var(--sp-fg);
			background: var(--sp-bg);
			transition:
				opacity 0.7s cubic-bezier(0.45, 0, 0.25, 1),
				visibility 0s linear 0.7s;
		}
		#splash.sp-dark {
			--sp-bg: #060709;
			--sp-fg: #eef1f5;
			--sp-c1: #8fb4ff;
			--sp-c2: #6fd1b0;
			--sp-c3: #efb36d;
			--sp-c4: #f2828c;
			--sp-c5: #b49cff;
			--sp-core: rgba(238, 241, 245, 0.16);
			--sp-ripple: rgba(238, 241, 245, 0.07);
			--sp-light: 0.3;
			--sp-mark-filter: none;
			--sp-blend: overlay;
		}
		/* The light: soft discs that grow from the mark past the screen's edges. */
		.sp-light {
			position: absolute;
			inset: 0;
			pointer-events: none;
			transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
		}
		.sp-light i {
			position: absolute;
			top: 50%;
			left: 50%;
			width: 60vmax;
			height: 60vmax;
			margin: -30vmax 0 0 -30vmax;
			background: radial-gradient(closest-side, var(--c), transparent);
			border-radius: 50%;
			opacity: 0;
			transform: translate(var(--x), var(--y)) scale(0.12);
			animation: sp-spread 2.2s cubic-bezier(0.22, 1, 0.36, 1) var(--d) forwards;
			will-change: transform, opacity;
		}
		.sp-light i:nth-child(1) {
			--c: var(--sp-c1);
			--x: 0vmax;
			--y: -18vmax;
			--d: 0.1s;
		}
		.sp-light i:nth-child(2) {
			--c: var(--sp-c2);
			--x: 17vmax;
			--y: -6vmax;
			--d: 0.18s;
		}
		.sp-light i:nth-child(3) {
			--c: var(--sp-c3);
			--x: 11vmax;
			--y: 15vmax;
			--d: 0.26s;
		}
		.sp-light i:nth-child(4) {
			--c: var(--sp-c4);
			--x: -11vmax;
			--y: 15vmax;
			--d: 0.34s;
		}
		.sp-light i:nth-child(5) {
			--c: var(--sp-c5);
			--x: -17vmax;
			--y: -6vmax;
			--d: 0.42s;
		}
		.sp-light b {
			position: absolute;
			top: 50%;
			left: 50%;
			width: 50vmax;
			height: 50vmax;
			margin: -25vmax 0 0 -25vmax;
			border-radius: 50%;
			opacity: 0;
			transform: scale(0.1);
			will-change: transform, opacity;
		}
		.sp-core {
			background: radial-gradient(closest-side, var(--sp-core), transparent);
			animation: sp-core 1.4s cubic-bezier(0.22, 1, 0.36, 1) 0.15s forwards;
		}
		.sp-ripple {
			background: radial-gradient(
				closest-side,
				transparent 55%,
				var(--sp-ripple) 80%,
				transparent
			);
			animation: sp-ripple 2.4s cubic-bezier(0.22, 1, 0.36, 1) 0.3s forwards;
		}
		.sp-ripple + .sp-ripple {
			animation-delay: 0.85s;
		}
		.sp-stage {
			position: relative;
			display: flex;
			flex-direction: column;
			gap: 18px;
			align-items: center;
			transition:
				transform 0.6s cubic-bezier(0.22, 1, 0.36, 1),
				opacity 0.45s ease;
		}
		.sp-mark {
			position: relative;
			width: 112px;
			height: 112px;
			overflow: hidden;
			border-radius: 22%;
			isolation: isolate;
			opacity: 0;
			transform: scale(0.9);
			animation: sp-mark-in 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
		}
		.sp-mark img {
			display: block;
			width: 100%;
			height: 100%;
			filter: var(--sp-mark-filter);
		}
		.sp-sweep {
			position: absolute;
			inset: -40%;
			background: linear-gradient(
				115deg,
				transparent 38%,
				#8fb4ff 44%,
				#6fd1b0 48%,
				#efb36d 52%,
				#f2828c 56%,
				#b49cff 60%,
				transparent 66%
			);
			mix-blend-mode: var(--sp-blend);
			transform: translateX(-70%);
			animation: sp-sweep 1.4s cubic-bezier(0.45, 0, 0.2, 1) 0.35s forwards;
		}
		.sp-word {
			margin-right: -0.16em;
			font-size: 22px;
			font-weight: 600;
			letter-spacing: 0.16em;
			opacity: 0;
			transform: translateY(8px);
			animation: sp-rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.45s forwards;
		}
		.sp-line {
			width: 128px;
			height: 2px;
			margin-top: -6px;
			background: linear-gradient(
				90deg,
				var(--sp-c1),
				var(--sp-c2),
				var(--sp-c3),
				var(--sp-c4),
				var(--sp-c5)
			);
			border-radius: 1px;
			opacity: 0;
			transform: scaleX(0);
			animation: sp-line-in 1s cubic-bezier(0.22, 1, 0.36, 1) 0.65s forwards;
		}
		/* Leaving: the light keeps spreading and the screen fades onto the app. */
		#splash.sp-out {
			visibility: hidden;
			opacity: 0;
		}
		#splash.sp-out .sp-light {
			transform: scale(1.6);
		}
		#splash.sp-out .sp-stage {
			opacity: 0;
			transform: scale(1.06);
		}
		@keyframes sp-spread {
			to {
				opacity: var(--sp-light);
				transform: translate(calc(var(--x) * 1.6), calc(var(--y) * 1.6))
					scale(2.2);
			}
		}
		@keyframes sp-core {
			to {
				opacity: 1;
				transform: none;
			}
		}
		@keyframes sp-ripple {
			15% {
				opacity: 1;
			}
			to {
				opacity: 0;
				transform: scale(3.4);
			}
		}
		@keyframes sp-mark-in {
			to {
				opacity: 1;
				transform: none;
			}
		}
		@keyframes sp-sweep {
			to {
				transform: translateX(70%);
			}
		}
		@keyframes sp-rise {
			to {
				opacity: 1;
				transform: none;
			}
		}
		@keyframes sp-line-in {
			to {
				opacity: 0.85;
				transform: none;
			}
		}
		@media (prefers-reduced-motion: reduce) {
			#splash,
			#splash * {
				transition: opacity 0.3s ease !important;
				animation: none !important;
			}
			#splash.sp-out {
				transition:
					opacity 0.3s ease,
					visibility 0s linear 0.3s !important;
			}
			.sp-mark,
			.sp-word,
			#splash .sp-stage {
				opacity: 1;
				transform: none;
			}
			.sp-line {
				opacity: 0.85;
				transform: none;
			}
			.sp-light,
			.sp-sweep {
				display: none;
			}
		}
		</style>
	</head>
	<body>
		<div aria-hidden="true" id="splash">
			<div class="sp-light">
				<b class="sp-core"></b>
				<i></i><i></i><i></i><i></i><i></i>
				<b class="sp-ripple"></b>
				<b class="sp-ripple"></b>
			</div>
			<div class="sp-stage">
				<div class="sp-mark">
					<img alt="" height="112" src="/logo.png" width="112">
					<span class="sp-sweep"></span>
				</div>
				<div class="sp-word">Mine</div>
				<div class="sp-line"></div>
			</div>
		</div>
		<script>
		"use strict";
		// Match the theme next-themes will pick ("theme" in localStorage).
		(() => {
			let theme = "system";
			try {
				theme = localStorage.getItem("theme") || "system";
			} catch {
				// Storage blocked: follow the system.
			}
			const dark =
				theme === "dark" ||
				(theme !== "light" &&
					matchMedia("(prefers-color-scheme: dark)").matches);
			document.getElementById("splash").classList.toggle("sp-dark", dark);
			window.__splashStart = performance.now();
			// Never cover the page for good, even if the app fails to load.
			setTimeout(() => {
				document.getElementById("splash")?.classList.add("sp-out");
			}, 10_000);
		})();
		</script>
		<div id="app"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
